[project]
name = "geniac-baseline"
version = "0.1.0.dev0"
description = "Baseline data conversion, LoRA training and CaP-X run wrappers for the GENIAC CaP competition."
readme = "README.md"
requires-python = ">=3.10"
# The core (convert, collect/eval command builders, scoring) needs only PyYAML.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Training stack. Lower bounds only; the exact versions of the baseline (transformers is a git revision) are in
# requirements-train.txt (docs/installation.md).
train = ["torch>=2.9", "torchvision>=0.24", "pillow>=10", "transformers>=4.57", "peft>=0.19", "accelerate>=1.4"]
# `convert tag` only needs a tokenizer.
tag = ["transformers>=4.57"]
# Optional experiment tracking. Off by default; the trainer never needs it.
wandb = ["wandb"]
# Optional: resolve a data location given as hf://<repo_id>[@<revision>][/<subdir>].
hub = ["huggingface_hub"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
geniac-baseline = "geniac_baseline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geniac_baseline"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = [".", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# Gateway task config for task_id nut_assembly (task_map).
# Made from the baseline's capx/geniac_prize/robosuite/nut_assembly.yaml: the same API, prompt, multi-turn prompt
# and servers, with the goal line taking the gateway's instruction ({task_instruction}).
# submission/install.sh copies it into env_configs/gateway/ of the submission image.
apis:
- FrankaControlApiReducedSkillLibrary
prompt: "You are controlling a Franka Emika robot with API described below.\nGoal: {task_instruction}\nNote that you would grasp the nut by its handle. You can try language query `extruded handle of the brown square nut` to get a good grasp at the handle.\nThe brown square nut and the extruded handle of the brown square nut are part of the same rigid body.\nThe grasp pose query for 'extruded handle of the brown square nut' returns an end-effector pose expressed in world frame, located on the handle region.\nThe nut's object center pose obtained via 'white hollow center of the brown square nut' and the handle grasp pose obtained via 'extruded handle of the brown square nut' have a fixed rigid transform, which must be applied correctly when inserting the nut onto the peg.\nYou may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.\nAfter this code executes, you will receive the current console stdout and stderr (any errors\
  \ or print statements made in the code). You will then have the chance to write new code to query the environment state and/or complete the task.\nThe functions (APIs) below are already imported to the environment. \nIf you want to use numpy, or scipy for spatial transformations, you need to import it explicitly.\n"
multi_turn_prompt: |
  The following code blocks were just executed:
  ```python
  {executed_code}
  ```
  The current console stdout is:
  ```
  {console_stdout}
  ```
  The current console stderr is:
  ```
  {console_stderr}
  ```
  If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
  Consider querying the environment state through perception-based tool calls and prints to see if the task is completed.
  Please respond with EXACTLY ONE of the following:
  - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
  - The word 'FINISH' if the task appears to be complete
api_servers:
- _target_: capx.serving.launch_pyroki_server.main
  port: 8116
  host: 127.0.0.1
  robot: panda_description
  target_link: panda_hand
- _target_: capx.serving.launch_contact_graspnet_server.main
  port: 8115
  host: 127.0.0.1
- _target_: capx.serving.launch_sam3_server.main
  device: cuda
  port: 8114
  host: 127.0.0.1
record_video: true

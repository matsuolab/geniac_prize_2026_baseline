# Gateway task config for task_id two_arm_handover (task_map).
# Made from the baseline's capx/geniac_prize/robosuite/two_arm_handover.yaml: the same API, prompt, multi-turn prompt
# and servers, with the goal line taking the gateway's instruction ({task_instruction}).
# submission/install.sh copies it into env_configs/gateway/ of the submission image.
apis:
- FrankaControlApiReducedSkillLibraryBimanualHandover
prompt: "You are controlling a two-arm Franka Emika robot system with API described below.\nGoal: {task_instruction}\n\nCoordinate system:\n- All pose functions accept positions in robot0's base frame (same coordinate system as returned/used by get_object_pose/goto_pose_arm*).\n- The table surface is not necessarily at z=0.\n- The coordinate axis follows these conventions:\n  - Z-axis: up (positive) and down (negative)\n  - X-axis: right (positive) and left (negative) \n  - Y-axis: forward (positive) and backward (negative)\n\nEnvironment details:\n- Arm 0 (left) and Arm 1 (right) are positioned on opposite sides of the table. \n- The hammer handle length is randomized between 0.15m and 0.25m.\n- The hammer initially lies flat on the table, aligned along the Y-axis, with the handle toward +Y and the hammer head toward -Y\n\nCritical information:\n- Handover must occur near the midpoint of the initial gripper positions. Reason about the best handover hammer orientation that allows collision-free\
  \ transfer to Arm 1.\n- The table does not span the entire region between the two arms. If the hammer falls in the central gap it will drop to the floor, making the task UNRECOVERABLE\n- AVOID COLLISIONS. You must decompose movements into rotation and translation components, moving stepwise. Reason about the optimal sequence of waypoints to safely avoid collisions.\n- Arm links have volume, and intermediate motions are not collision-checked. Keep a minimum 8cm buffer between grippers\n\nReference quaternions:\n- Arm0 gripper facing down opening along X-axis: [0, 0.707, 0.707, 0].\n- Arm0 gripper facing down opening along Y-axis: [0, 1, 0, 0].\n- Arm1 gripper facing down opening along Y-axis: [0, 0, 1, 0].\n\nArm gripper approximate initial starting positions (robot0 frame). These values are rough and may vary by a few centimeters each trial:\n- Arm0: x ≈ 0.44. y ≈ 0.0\n- Arm1: x ≈ 1.18. y ≈ 0.0\n\nYou may write python code comments for reasoning but ONLY write the executable Python code\
  \ and do not write it in code fences.\nAfter this code executes, you will receive the current console stdout and stderr (any errors or print statements made in the code). You will then have the chance to write new code to query the environment state and/or complete the task.\nThe functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.\n"
multi_turn_prompt: |
  The following code blocks were just executed:
  ```python
  {executed_code}
  ```
  The current console stdout is:
  ```
  {console_stdout}
  ```
  The current console stderr is:
  ```
  {console_stderr}
  ```
  If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
  Consider querying the environment state through perception-based tool calls and prints to see if the task is completed.
  Please respond with EXACTLY ONE of the following:
  - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
  - The word 'FINISH' if the task appears to be complete
api_servers:
- _target_: capx.serving.launch_sam3_server.main
  device: cuda
  port: 8114
  host: 127.0.0.1
- _target_: capx.serving.launch_contact_graspnet_server.main
  port: 8115
  host: 127.0.0.1
- _target_: capx.serving.launch_pyroki_server.main
  port: 8116
  host: 127.0.0.1
  robot: panda_description
  target_link: panda_hand
record_video: true

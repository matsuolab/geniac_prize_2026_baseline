# Run spec for `geniac-baseline eval plan --spec configs/eval_base_libero.yaml` (examples/01_eval_base_cap_agent0.sh): LIBERO-PRO, 30 tasks, evaluation layouts 40-49,
# base model. Score afterwards with `geniac-baseline eval score <output_dir>`. Settings: docs/eval.md.
#
# Tree: the competition CaP-X + patch (bash patches/geniac_prize/setup.sh, docs/installation.md). To reproduce the
# baseline numbers use the ASPIRE tree instead (docs/reproduce_baseline.md): capx_root: <ASPIRE root>,
# launch_script: aspire/sim/cap/envs/launch.py, pythonpath: <ASPIRE root>, and configs/capx/aspire/... as the
# task configs.

mode: eval
capx_root: ../geniac_prize_2026_code   # bash patches/geniac_prize/setup.sh writes it here
launch_script: capx/envs/launch.py      # relative to capx_root
sim_python: .venv-libero/bin/python    # relative to capx_root (LIBERO-PRO has its own venv)
serve_python: .venv-serve/bin/python    # an environment with vLLM
pythonpath: null                        # extra PYTHONPATH for the launch (ASPIRE: its root)

model: Qwen/Qwen3.8-27B   # served model name; weights: Qwen/Qwen3.8-27B revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
model_path: null          # local weights directory; null = let vLLM resolve the model id
molmo: true               # Molmo2-8B pointing server (nut_assembly's API uses it)
molmo_path: null
chat_template: ../runs/qwen38_low_reasoning.jinja   # geniac-baseline template --model-dir <snapshot> --out <this path>

output_dir: ../runs/eval_base_libero
port_offset: 0            # perception servers (*_SERVICE_URL); 0 = CaP-X default ports
vllm_port_offset: 0
b300_workarounds: false   # true on B300: attention-kernel flags + TORCH_CUDA_ARCH_LIST=10.0
num_workers: null         # null = the config's num_workers (8)
trial_timeout_s: 2400     # per trial wall clock (ASPIRE default the baseline ran with)
# GPU: one GPU holds every server; shares below are the baseline's on a 275 GB B300 (docs/collect.md)
max_model_len: 262144
tensor_parallel_size: 1
qwen_gpu_util: null       # null = 0.62 (collect, one server) / 0.30 per server (eval, two servers)
molmo_gpu_util: 0.28
adapter: null             # base model
lora_name: null
code_thinking: false      # code writer with thinking off (true = like collection)


name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU only, no torch)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest -q

  torch:
    # CPU torch so the gradient check of the DMPO loss (tests/test_dmpo_torch.py) actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (CPU torch)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test (torch must import, so the torch tests run instead of skipping)
        run: |
          uv run --no-sync python -c "import torch; print(torch.__version__)"
          uv run --no-sync pytest -q -rs tests/test_dmpo_torch.py
